version: '3.8'

services:
  aurora:
    build: .
    container_name: aurora_platform
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./aurora.db:/app/aurora.db
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-25307036}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-11285731405a814dd4b3af1c61bdd482}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-8679611350:AAHA41eGl2TRPzefxf1jYzLFPyrhN_m3JqY}
      - OWNER_ID=${OWNER_ID:-5342258541}
      - OWNER_USERNAME=${OWNER_USERNAME:-tglegend77}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///aurora.db}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-gK7Z3tL9v_xR8wB2mN5pQ1yD4sV6uF0aJ3kL9mP2nR8=}
